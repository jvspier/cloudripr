<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1600px;
        height: 900px;
        overflow: hidden;
        font-family: "Inter Variable", Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #34199e 0%, #4a2bd6 50%, #5a36f0 100%);
        color: #fff;
        position: relative;
      }
      .title { position: absolute; left: 90px; top: 92px; width: 560px; }
      .brand { display: flex; align-items: center; gap: 18px; }
      .brand img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 12px 30px rgba(0, 0, 0, .3); }
      h1 { font-size: 64px; font-weight: 800; letter-spacing: -0.03em; }
      p.tag { margin-top: 26px; font-size: 30px; line-height: 1.3; font-weight: 600; }
      ul { margin-top: 30px; padding: 0; list-style: none; font-size: 21px; line-height: 1.9; }
      li::before { content: "✓"; display: inline-block; width: 30px; font-weight: 800; }
      .laptop {
        position: absolute; right: -60px; top: 120px; width: 960px;
        border-radius: 16px; overflow: hidden; background: #fff;
        box-shadow: 0 40px 90px rgba(0, 0, 0, .4);
      }
      .bar { height: 34px; background: #ece9f8; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
      .bar i { width: 12px; height: 12px; border-radius: 50%; background: #d4cfe8; display: block; }
      .laptop img { display: block; width: 100%; }
      .phone {
        position: absolute; left: 640px; top: 400px; width: 270px;
        border-radius: 46px; padding: 11px; background: #15131f;
        box-shadow: 0 40px 80px rgba(0, 0, 0, .5);
      }
      .phone img { display: block; width: 100%; border-radius: 36px; }
    </style>
  </head>
  <body>
    <div class="title">
      <div class="brand">
        <img src="{{ICON}}" alt="" />
        <h1>cloudripr</h1>
      </div>
      <p class="tag">Nightly iCloud Photos backups to your own disk, that never stall on 2FA.</p>
      <ul>
        <li>Sign in again from your iPhone in a minute</li>
        <li>A safety check before anything downloads twice</li>
        <li>See what landed on disk, every night</li>
      </ul>
    </div>
    <div class="laptop">
      <div class="bar"><i></i><i></i><i></i></div>
      <img src="laptop-light-photos.png" alt="" />
    </div>
    <div class="phone"><img src="phone-dark-home.png" alt="" /></div>
  </body>
</html>

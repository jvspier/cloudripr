<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        font-family: "Inter Variable", Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #34199e 0%, #4a2bd6 50%, #5a36f0 100%);
        color: #fff;
        position: relative;
      }
      .title { position: absolute; left: 72px; top: 150px; width: 500px; }
      .brand { display: flex; align-items: center; gap: 16px; }
      .brand img { width: 68px; height: 68px; border-radius: 16px; box-shadow: 0 10px 26px rgba(0, 0, 0, .3); }
      h1 { font-size: 62px; font-weight: 800; letter-spacing: -0.03em; }
      p.tag { margin-top: 26px; font-size: 30px; line-height: 1.3; font-weight: 600; }
      p.sub { margin-top: 20px; font-size: 21px; line-height: 1.45; }
      .laptop {
        position: absolute; left: 720px; top: 70px; width: 720px;
        border-radius: 14px; overflow: hidden; background: #fff;
        box-shadow: 0 30px 70px rgba(0, 0, 0, .4);
      }
      .bar { height: 28px; background: #ece9f8; display: flex; align-items: center; gap: 7px; padding: 0 12px; }
      .bar i { width: 10px; height: 10px; border-radius: 50%; background: #d4cfe8; display: block; }
      .laptop img { display: block; width: 100%; }
      .phone {
        position: absolute; left: 620px; top: 250px; width: 210px;
        border-radius: 38px; padding: 9px; background: #15131f;
        box-shadow: 0 30px 60px rgba(0, 0, 0, .5);
      }
      .phone img { display: block; width: 100%; border-radius: 30px; }
    </style>
  </head>
  <body>
    <div class="title">
      <div class="brand">
        <img src="{{ICON}}" alt="" />
        <h1>cloudripr</h1>
      </div>
      <p class="tag">Nightly iCloud Photos backups to your own disk.</p>
      <p class="sub">Self-hosted. Signs in again from your iPhone in a minute, and never stalls on 2FA.</p>
    </div>
    <div class="laptop">
      <div class="bar"><i></i><i></i><i></i></div>
      <img src="laptop-light-photos.png" alt="" />
    </div>
    <div class="phone"><img src="phone-dark-home.png" alt="" /></div>
  </body>
</html>

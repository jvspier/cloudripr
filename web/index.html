<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="cloudripr" />
    <meta name="theme-color" content="#5A36F0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>cloudripr</title>
    <script>
      // Light/dark before first paint; same rules as src/lib/theme.ts.
      (function () {
        var pref = "auto";
        try {
          pref = localStorage.getItem("cloudripr.theme") || "auto";
        } catch (e) {}
        var dark =
          pref === "dark" ||
          (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# cloudripr: see README.md → Quick start.
services:
  cloudripr:
    image: ghcr.io/jvspier/cloudripr:1
    container_name: cloudripr
    restart: unless-stopped
    # Reaps the short-lived 2FA hook process icloudpd can leave behind when a run stops.
    init: true
    ports:
      - "8080:5000"
    environment:
      TZ: Europe/Amsterdam # your time zone: the schedule runs on it
      # PASSWORD_HASH: '...' # optional, see README → Configuration
    volumes:
      - ./data:/data # settings, Apple session, history: back this up
      - /path/to/your/photos:/downloads # the library; keep this path stable
      - ./cache:/cache # thumbnails and index: disposable, never inside the library
